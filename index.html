:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",-apple-system,"Segoe UI",Roboto,Arial,"Hiragino Sans","Yu Gothic","Noto Sans JP","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;font-size:14.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,select,input{font-family:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px;border-radius:8px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.bar .in{max-width:1180px;margin:0 auto;padding:12px 22px;display:flex;align-items:center;gap:14px}
.logo{display:flex;align-items:center;gap:11px;margin-right:auto;min-width:0}
.logo .mk{width:38px;height:38px;border-radius:11px;background:#FFFFFF;border:1px solid var(--line);display:grid;place-items:center;overflow:hidden;flex:none}
.logo .mk img{width:30px}
.logo b{font-size:16.5px;font-weight:700;letter-spacing:-.01em;display:block;line-height:1.2}
.logo span{font-size:12.5px;color:var(--muted);display:block}
.themes{display:flex;gap:7px}
.langsel{height:32px;font-size:13px;padding:0 6px;border-radius:8px;background:var(--s2);color:var(--ink);border:1px solid var(--line)}
.themes button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);cursor:pointer;padding:0;position:relative}
.themes button[aria-pressed=true]{border-color:var(--primary);box-shadow:0 0 0 2px var(--surface) inset}
.themes button span{position:absolute;inset:0;border-radius:50%}
.wrap{max-width:1180px;margin:0 auto;padding:24px 22px 40px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;margin:0 0 4px;line-height:1.15}
.lead{color:var(--muted);margin:0 0 18px;max-width:72ch}
.grid{display:grid;gap:16px}.g12{grid-template-columns:repeat(12,minmax(0,1fr))}.c6{grid-column:span 6}.c12{grid-column:span 12}
.card{background:var(--surface);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);border:1px solid var(--line);min-width:0}
.card h3{margin:0;font-size:15.5px;font-weight:700;display:flex;align-items:center;gap:8px}
.card .cap,.cap{font-size:13px;color:var(--muted);margin:4px 0 12px}
.hdr{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.info{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:var(--s2);color:var(--muted);font-weight:700;cursor:pointer}
.explain{margin-top:10px;font-size:13px;color:var(--muted);background:var(--s2);border-radius:12px;padding:10px 12px}
.btn{border:0;border-radius:10px;padding:10px 16px;font-size:14px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--primary);color:var(--primary-ink)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.tg{border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer}
.tg:disabled{opacity:.45;cursor:not-allowed}
select{height:40px;font:inherit;font-size:14px;color:var(--ink);background:var(--s2);border:1px solid var(--line);border-radius:10px;padding:0 8px}
.seg{display:flex;gap:4px;background:var(--s2);border-radius:10px;padding:4px;border:1px solid var(--line)}
.seg button{flex:1;font-size:13px;font-weight:600;padding:8px;border:0;border-radius:7px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.err{color:var(--bad);font-size:13px;margin-top:10px;font-weight:600}
.chart{display:block;max-width:100%;height:auto}
.halo{paint-order:stroke;stroke:var(--surface);stroke-width:3px}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.callout{border-radius:12px;padding:11px 14px;font-size:13.5px;background:var(--warn-bg)}
.callout.info{background:var(--primary-soft)}
.plate{background:#FFFFFF;border-radius:16px;padding:10px;display:grid;place-items:center;border:1px solid var(--line)}
.plate img{display:block}
details.acc{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 20px}
details.acc summary{cursor:pointer;font-weight:700;font-size:15px;list-style:none}
details.acc summary::-webkit-details-marker{display:none}
details.acc summary::after{content:"Show";float:right;color:var(--primary);font-weight:600;font-size:13px}
details.acc[open] summary::after{content:"Hide"}
details.acc[open] summary{margin-bottom:10px}
.empty{display:flex;gap:18px;align-items:center}
.stepper{list-style:none;margin:0;padding:0;display:flex;gap:6px;flex-wrap:wrap}
.stepper .st{display:flex;align-items:center;gap:8px;padding:7px 14px 7px 8px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--muted)}
.stepper .st b{width:24px;height:24px;border-radius:7px;display:grid;place-items:center;background:var(--s2);font-size:12px}
.stepper .st.on{color:var(--ink);border-color:var(--primary)}.stepper .st.on b{background:var(--primary);color:var(--primary-ink)}
.stepper .st.done b{background:var(--ok);color:#fff}
.drop{border:2px dashed var(--primary);border-radius:18px;background:var(--surface);padding:30px;display:grid;grid-template-columns:auto minmax(0,1fr);gap:28px;align-items:center;transition:background .15s}
.drop.over{background:var(--primary-soft)}
.drop .art{display:flex;gap:12px;align-items:flex-end}
.drop h3{font-size:21px;font-weight:700;margin:0 0 6px;letter-spacing:-.01em}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:center}
.note{font-size:12.5px;color:var(--muted);margin-top:14px;max-width:70ch}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
.tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl th{font-size:12px;color:var(--muted);font-weight:700;background:var(--s2);white-space:nowrap}
.tbl .num{text-align:right;white-space:nowrap}
.tbl select{height:34px;max-width:280px;width:100%}
.tbl tr.off td{color:var(--faint)}
.tbl.xtab td:not(:first-child):not(:last-child){text-align:center;font-weight:700}
.muted{color:var(--muted)}
.dsbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px}
.dsbar>div{display:flex;flex-direction:column;min-width:0;margin-right:auto}
.dsbar b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dsbar span{font-size:12.5px;color:var(--muted)}
h2.sec{font-size:18px;font-weight:700;margin:8px 0 2px;letter-spacing:-.01em}
.dgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.dcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-width:0;position:relative;overflow:hidden}
.dcard.warn{border-color:var(--warn)}
.dcard.warn::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--warn)}
.dcard .dh{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.dcard .dh b{font-size:14px}
.dcard .src{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dcard .st{font-size:12px;color:var(--muted);white-space:nowrap}
.flag{display:block;font-size:12px;font-weight:500;padding:6px 9px;border-radius:8px;background:var(--warn-bg);color:var(--ink);margin-top:8px;line-height:1.35}
.flag.fi{background:var(--primary-soft)}
.mbars{display:grid;gap:5px}
.mb{display:grid;grid-template-columns:72px minmax(0,1fr) 34px;gap:8px;align-items:center;font-size:12px}
.mb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted);font-weight:600}
.mb .b{height:10px;background:var(--s2);border-radius:5px;overflow:hidden}.mb .b i{display:block;height:100%;background:var(--chart);border-radius:5px}
.mb .c{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.issues{list-style:none;margin:0;padding:0}.issues li{display:flex;gap:10px;align-items:baseline;font-size:13.5px;margin:8px 0;flex-wrap:wrap}
.issues .dot{width:9px;height:9px;border-radius:50%;background:var(--warn);flex:none;transform:translateY(1px)}.issues li.ok .dot{background:var(--ok)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.opts .lab{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
.dheat{display:grid;grid-template-columns:44px repeat(3,minmax(0,1fr));gap:6px}
.dheat .hd{font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center}
.dheat .cell{border-radius:9px;min-height:52px;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--cell-ink)}
.dheat .cell b{font-size:18px;font-weight:700}.dheat .cell span{font-size:11.5px;font-weight:600;opacity:.85}
.pager{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--muted)}
.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:12.5px;color:var(--muted)}.legend span{display:inline-flex;align-items:center;gap:6px}.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}
.check{display:flex;gap:8px;align-items:center;font-size:13px;margin-top:12px;color:var(--ink)}.check input{width:18px;height:18px;accent-color:var(--primary)}
.cinputs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.cin span{display:block;font-size:12px;color:var(--muted);font-weight:600;margin-bottom:4px}
.cin input{width:100%;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--s2);color:var(--ink);padding:0 10px;font:inherit;font-variant-numeric:tabular-nums}
@media (max-width: 700px){ .cinputs{grid-template-columns:1fr} }
.foot{max-width:1180px;margin:0 auto;padding:0 22px 30px;font-size:12px;color:var(--faint)}
@media (max-width: 1000px){ .c6{grid-column:span 12} .kpis{grid-template-columns:repeat(2,minmax(0,1fr))} }
@media (max-width: 700px){ .wrap{padding:18px 14px 30px} .bar .in{padding:10px 14px} h1{font-size:23px} .drop{grid-template-columns:1fr;padding:20px} .drop .art{justify-content:center} .opts{grid-template-columns:1fr} .card{padding:16px} .logo span{display:none} }
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
